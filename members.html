<style type="text/css">

svg.ct-chart-bar, svg.ct-chart-line {
	overflow: visible;
}

.ct-label.ct-label.ct-horizontal.ct-end {
	position: relative;
	justify-content: flex-end;
	text-align: right;
	transform-origin: 100% 0;
	transform: translate(-100%) rotate(-45deg);
	white-space: nowrap;
}
.ct-series-b,
.ct-series-b .ct-line,
.ct-series-b .ct-point {
  stroke: darkblue;
  color: darkblue;
}

.ct-series-a,
.ct-series-a .ct-line,
.ct-series-a .ct-point {
  stroke: green;
  color: green;
}

</style>
</head>
